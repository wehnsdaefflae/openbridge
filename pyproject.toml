[project]
name = "openbridge"
version = "0.0.1"
description = "Bruecken zu geschlossenen Chat- und Arbeitsplattformen automatisch nachziehen"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mark Wernsdorfer" }]
